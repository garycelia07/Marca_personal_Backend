services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gary-mayhua-api:1.0.0
    restart: unless-stopped
    env_file:
      - ./.env.production
    volumes:
      - materials-data:/data/gary-mayhua/uploads
    expose:
      - "3000"
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - backend

volumes:
  materials-data:

networks:
  backend:
